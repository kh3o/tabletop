<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletop Data Tracker Engine</title>
    <link rel="stylesheet" href="./src/css/core.css">
    <link rel="stylesheet" href="./src/css/players.css">
    <link rel="stylesheet" href="./src/css/monsters.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>
    <div id="app" data-game-engine="massive-darkness-2">
        
        <!-- Top Navigation Bar (always pinned on top) -->
        <nav id="top-nav">
            <span class="nav-title">TABLETOP TRACKER</span>
            <div class="nav-actions">
                <button class="nav-btn" id="nav-characters">CHARACTERS</button>
                <button class="nav-btn" id="nav-monsters">MONSTERS</button>
                <button class="nav-btn nav-toggle" id="nav-layout" title="Toggle horizontal/vertical layout">‖ LAYOUT</button>
                <button class="nav-btn nav-reset" id="nav-reset" title="Reset to defaults">↺ RESET</button>
            </div>
        </nav>

        <!-- Frames container (gets layout direction class) -->
        <div id="frames-container" class="layout-horizontal">

        <!-- Player Frame -->
        <section id="player-frame" class="frame expanded">
            <div class="player-frame-header" data-toggle-frame="player-frame">
                <span class="frame-title">PLAYER STATS</span>
                <div class="hud-toggle-icon">▲</div>
            </div>

            <!-- Player grid cards - always visible even when collapsed -->
            <div id="player-cards-grid" class="player-cards-grid"></div>

            <!-- Collapsible content (character detail) -->
            <div class="frame-content">
                <!-- Character selector -->
                <div class="character-selector-row">
                    <label class="selector-label">FOCUS:</label>
                    <select id="character-selector" class="selector-select">
                        <option value="">— Select character —</option>
                    </select>
                    <button class="btn btn-add" id="btn-add-character" style="font-size:0.85rem;padding:6px 10px;">+ ADD</button>
                </div>

                <!-- Player detail cards container (for player2+) -->
                <div id="player-detail-cards"></div>

                <!-- Focused character detail -->
                <div class="focused-character-card" data-character-id="player1">
                    <div class="focused-header">
                        <h2><span class="char-name">Elias</span> <span class="level-indicator">Level <span class="char-lvl">2</span></span></h2>
                        <div class="focused-actions">
                            <button class="btn btn-step turn-done-btn" id="btn-turn-done" data-player-id="player1">✓ TURN</button>
                            <button class="btn alert-btn remove-player-trigger" data-player-id="player1">REMOVE</button>
                        </div>
                    </div>
                    <div class="potion-row">
                        <span class="potion-chip" id="hp-potion" data-potion="hp">🧪 <span class="potion-count">2</span></span>
                        <span class="potion-chip" id="mp-potion" data-potion="mp">🔮 <span class="potion-count">1</span></span>
                    </div>
                    
                    <div class="stat-slider-group">
                        <div class="vector-control hp-vector">
                            <label>Health Points</label>
                            <div class="slider-interaction">
                                <button class="btn btn-dmg" data-stat-type="hp" data-amount="-1">DMG</button>
                                <div class="bar-container"><span class="bar-text">10 / 12</span></div>
                                <button class="btn btn-heal" data-stat-type="hp" data-amount="1">HEAL</button>
                            </div>
                        </div>

                        <div class="vector-control mana-vector">
                            <label>Mana Pool</label>
                            <div class="slider-interaction">
                                <button class="btn btn-dmg" data-stat-type="mp" data-amount="-1">DMG</button>
                                <div class="bar-container"><span class="bar-text">4 / 6</span></div>
                                <button class="btn btn-heal" data-stat-type="mp" data-amount="1">HEAL</button>
                            </div>
                        </div>

                        <div class="vector-control xp-vector">
                            <label>Experience (Progress Tracker)</label>
                            <div class="slider-interaction">
                                <button class="btn btn-step" data-stat-type="xp" data-amount="-1">-1</button>
                                <div class="bar-container readonly"><span class="bar-text">24 / 50 XP</span></div>
                                <button class="btn btn-step" data-stat-type="xp" data-amount="1">+1</button>
                                <button class="btn btn-add level-up-btn" id="btn-level-up" style="display:none;">LEVEL UP</button>
                            </div>
                        </div>
                    </div>

                    <div class="dynamic-inventory-zone">
                        <div class="slot-placeholder">Class Skill Tree / Equipment Active</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Monster Frame -->
        <section id="monster-frame" class="frame expanded">
            <div class="resume-hud" data-toggle-frame="monster-frame">
                <span class="frame-title">Active Monsters Summary</span>
                <div class="hud-mini-stats">
                    <span>Threats: <span id="mob-count">0</span> Mobs</span>
                    <span class="stat-badge mob-count">Total Figures: <span id="figure-count">0</span></span>
                </div>
                <div class="hud-toggle-icon">▼</div>
            </div>

            <div class="frame-content scrollable" id="monster-cards-scroll">
                <div id="monster-selector-panel" class="monster-selector-panel">
                    <div class="selector-row">
                        <span class="selector-label">ADD MONSTER:</span>
                        <select id="selector-type" class="selector-select">
                            <option value="group">Group (Leader + Minions)</option>
                            <option value="roaming">Roaming Monster</option>
                        </select>
                        <select id="selector-monster" class="selector-select">
                            <option value="">— Select monster —</option>
                        </select>
                        <button class="btn btn-add" id="btn-add-monster">+ SPAWN</button>
                    </div>
                    <div class="selector-info">
                        <span>Auto-tier: <span id="auto-tier-display">1</span> · Minions: <span id="auto-minion-display">2</span></span>
                    </div>
                </div>
                <div id="monster-cards-container"></div>
            </div>
        </section>

        </div><!-- /frames-container -->

    </div>
    <script src="./src/js/ui-controller.js"></script>
    <script src="./src/js/monster-library.js"></script>
    <script src="./src/js/app.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    console.log('Service Worker registered! Scope:', registration.scope);
                })
                .catch(error => {
                    console.error('Service Worker registration failed:', error);
                });
        });
    }
    </script>
</body>
</html>
